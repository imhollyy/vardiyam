# Hafif alt ajan varsayılanı; kullanım kapsamını PROJECT_CONSTITUTION.md §12 belirler.
[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"

[agents.reviewer]
description = "Dar diff'i acceptance, correctness, regression ve test riski için bağımsız incele; kod yazma, somut bulgu ve kanıt üret."

[agents.pay_reviewer]
description = "Yalnız ücret ve zaman segmentasyonu değişikliklerini bağımsız doğrula; katsayı, sınır ve geçmiş snapshot risklerini raporla."

[agents.ui_reviewer]
description = "Yalnız UI değişikliklerini erişilebilirlik, light/dark, mobil platform uyumu ve ekran durumları açısından incele."

# OpenAI/Codex dokümantasyonu gerektiğinde kullan; genel görevlerde çağırma.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

# Context7 MCP kullanıcı seviyesinde kurulu; Vardiyam'da CLI + on-demand skill kullan.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = false
